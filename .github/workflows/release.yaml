name: Release
description: Build, push to IPFS and deploy when a GitHub Release is published

# Releases are the single deploy trigger. The tag prefix selects the app:
#   vX.Y.Z        -> credits app   (must be tagged on main)
#   legacy-vX.Y.Z -> legacy app    (must be tagged on legacy)
on:
  release:
    types: [published]

jobs:
  resolve:
    name: Resolve target app
    runs-on: ubuntu-22.04
    outputs:
      app: ${{ steps.target.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve app and validate tag
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
          DEPLOY_APP: ${{ vars.DEPLOY_APP }}
          DEPLOY_CREDITS_APP: ${{ vars.DEPLOY_CREDITS_APP }}
        run: |
          set -euo pipefail
          # Pre-release tags (e.g. v1.0.0-rc.1) are deliberately rejected:
          # every release deploys to production.
          if [[ ! "${TAG}" =~ ^(legacy-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '${TAG}' must look like vX.Y.Z (credits) or legacy-vX.Y.Z (legacy)."
            exit 1
          fi

          case "${TAG}" in
            legacy-v*)
              APP="${DEPLOY_APP}"
              BRANCH="legacy"
              VERSION="${TAG#legacy-v}"
              ;;
            v*)
              APP="${DEPLOY_CREDITS_APP}"
              BRANCH="main"
              VERSION="${TAG#v}"
              ;;
          esac

          if [ -z "${APP}" ]; then
            echo "Error: deploy app for '${BRANCH}' is not configured (repository variable is empty)."
            exit 1
          fi

          git fetch --no-tags origin "${BRANCH}"
          if ! git merge-base --is-ancestor "${SHA}" "origin/${BRANCH}"; then
            echo "Error: tag '${TAG}' points at ${SHA}, which is not an ancestor of branch '${BRANCH}'."
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "Error: tag '${TAG}' but package.json is at ${PKG_VERSION}. Merge the version bump PR first."
            exit 1
          fi

          echo "Tag '${TAG}' (${BRANCH}, v${VERSION}) -> app '${APP}'"
          echo "app=${APP}" >> $GITHUB_OUTPUT

  build:
    name: Build & export static site
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Export
        uses: aleph-im/aleph-github-actions/build-nextjs-app@v1
        with:
          fa-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          node-version: 25.1.0

      - name: Upload export as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-export
          path: out
          if-no-files-found: error
          retention-days: 1

  push-to-ipfs:
    name: Push site to IPFS
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      cid_v0: ${{ steps.push_to_ipfs.outputs.cid_v0 }}
      cid_v1: ${{ steps.push_to_ipfs.outputs.cid_v1 }}
    steps:
      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-export
          path: out

      - name: Push to IPFS
        id: push_to_ipfs
        uses: aleph-im/aleph-github-actions/push-to-ipfs@v1.3.1
        with:
          upload-dir: out

  deploy-app:
    name: Deploy to production
    needs: [resolve, push-to-ipfs]
    runs-on: ubuntu-latest
    environment: production
    # Serialise deploys per app so back-to-back releases land in order.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.app }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install -r scripts/deploy/requirements.txt
        shell: bash

      - name: Deploy to Aleph
        env:
          CID: ${{ needs.push-to-ipfs.outputs.cid_v0 }}
          APP: ${{ needs.resolve.outputs.app }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "Deploying ${CID} to '${APP}'"
          python scripts/deploy/client.py \
            --cid "${CID}" \
            --app "${APP}" \
            --url "${DEPLOY_URL}" \
            --key "${DEPLOY_PRIVATE_KEY}"

  annotate-release:
    name: Add CID to release notes
    needs: [resolve, push-to-ipfs, deploy-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Append CID and preview URL to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          APP: ${{ needs.resolve.outputs.app }}
          CID_V0: ${{ needs.push-to-ipfs.outputs.cid_v0 }}
          CID_V1: ${{ needs.push-to-ipfs.outputs.cid_v1 }}
        run: |
          set -euo pipefail
          # Drop any previous deploy block (re-runs / rollbacks) before appending.
          BODY=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' \
            | sed '/<!-- deploy-info -->/,$d')
          printf '%s\n<!-- deploy-info -->\n---\n**Deployed to:** `%s`\n**IPFS CID:** `%s`\n**Preview:** https://%s.ipfs.aleph.sh\n' \
            "${BODY}" "${APP}" "${CID_V0}" "${CID_V1}" > body.md
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file body.md
          {
            echo "**Deployed to:** \`${APP}\`"
            echo "**IPFS CID:** \`${CID_V0}\`"
            echo "**Preview:** https://${CID_V1}.ipfs.aleph.sh"
          } >> $GITHUB_STEP_SUMMARY
